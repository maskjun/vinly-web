<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vinyl Lia - 用户协议</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="orb orb-a"></div>
  <div class="orb orb-b"></div>

  <header class="topbar glass">
    <div class="brand">Vinyl Lia</div>
    <nav class="nav">
      <a href="./index.html">Home</a>
      <a href="./privacy.html">Privacy</a>
    </nav>
    <div class="lang-switch">
      <button id="lang-zh" class="active">中文</button>
      <button id="lang-en">EN</button>
    </div>
  </header>

  <main class="doc-container">
    <section class="doc-header glass">
      <h1 data-i18n="title">用户协议</h1>
      <p data-i18n="updated">最后更新：2026-04-21</p>
    </section>

    <article class="doc-content glass">
      <section>
        <h2 data-i18n="s1.title">1. 服务说明</h2>
        <p data-i18n="s1.body">Vinyl Lia 提供唱片收藏管理、推荐与相关信息展示服务。你应在合法合规范围内使用本服务。</p>
      </section>
      <section>
        <h2 data-i18n="s2.title">2. 账户与安全</h2>
        <p data-i18n="s2.body">你应妥善保管账户信息并对账号行为负责。如发现异常，请及时联系支持团队。</p>
      </section>
      <section>
        <h2 data-i18n="s3.title">3. 使用规范</h2>
        <p data-i18n="s3.body">不得利用本服务从事违法、侵权或破坏系统稳定性的行为。</p>
      </section>
      <section>
        <h2 data-i18n="s4.title">4. 责任限制</h2>
        <p data-i18n="s4.body">在法律允许范围内，我们将持续改进服务，但不对因不可抗力或第三方原因导致的中断承担无限责任。</p>
      </section>
      <section>
        <h2 data-i18n="s5.title">5. 协议更新</h2>
        <p data-i18n="s5.body">我们可能根据业务与法律要求更新协议，更新后将在相关页面展示最新版本。</p>
      </section>
    </article>
  </main>

  <script>
    const dict = {
      zh: {
        title: "用户协议",
        updated: "最后更新：2026-04-21",
        "s1.title": "1. 服务说明",
        "s1.body": "Vinyl Lia 提供唱片收藏管理、推荐与相关信息展示服务。你应在合法合规范围内使用本服务。",
        "s2.title": "2. 账户与安全",
        "s2.body": "你应妥善保管账户信息并对账号行为负责。如发现异常，请及时联系支持团队。",
        "s3.title": "3. 使用规范",
        "s3.body": "不得利用本服务从事违法、侵权或破坏系统稳定性的行为。",
        "s4.title": "4. 责任限制",
        "s4.body": "在法律允许范围内，我们将持续改进服务，但不对因不可抗力或第三方原因导致的中断承担无限责任。",
        "s5.title": "5. 协议更新",
        "s5.body": "我们可能根据业务与法律要求更新协议，更新后将在相关页面展示最新版本。"
      },
      en: {
        title: "Terms of Service",
        updated: "Last updated: 2026-04-21",
        "s1.title": "1. Service Overview",
        "s1.body": "Vinyl Lia provides record collection management, recommendation, and related content display services. You agree to use the service lawfully.",
        "s2.title": "2. Account & Security",
        "s2.body": "You are responsible for safeguarding account credentials and activities under your account. Contact support if any issue is found.",
        "s3.title": "3. Acceptable Use",
        "s3.body": "You must not use the service for illegal, infringing, or disruptive behavior.",
        "s4.title": "4. Limitation of Liability",
        "s4.body": "To the extent permitted by law, we continuously improve the service but are not liable without limit for interruptions caused by force majeure or third parties.",
        "s5.title": "5. Updates",
        "s5.body": "We may update these terms based on product or legal requirements. The latest version will be published on related pages."
      }
    };

    function setLanguage(lang) {
      document.documentElement.lang = lang === "en" ? "en" : "zh-CN";
      const pack = dict[lang] || dict.zh;
      document.querySelectorAll("[data-i18n]").forEach((el) => {
        const key = el.getAttribute("data-i18n");
        if (pack[key]) el.textContent = pack[key];
      });
      document.getElementById("lang-zh").classList.toggle("active", lang === "zh");
      document.getElementById("lang-en").classList.toggle("active", lang === "en");
      localStorage.setItem("vinyl_web_lang", lang);
    }

    document.getElementById("lang-zh").addEventListener("click", () => setLanguage("zh"));
    document.getElementById("lang-en").addEventListener("click", () => setLanguage("en"));
    setLanguage(localStorage.getItem("vinyl_web_lang") || "zh");
  </script>
</body>
</html>
